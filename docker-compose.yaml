services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_H2_CONSOLE_ENABLED: true
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: true
      BOOKING_PROPERTIES_DAYS: 90
      BOOKING_PROPERTIES_GUESTS: 12
      BOOKING_PROPERTIES_BOOKINGS: 10
      BOOKING_PROPERTIES_OPEN: "12:00"
      BOOKING_PROPERTIES_CLOSED: "22:00"
    volumes:
      - h2-data:/booking/data

volumes:
  h2-data: