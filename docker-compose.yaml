services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/booking/data/db
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_H2_CONSOLE_ENABLED: "true"
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
      BOOKING_LIMITS_DAYS: 90
      BOOKING_LIMITS_GUESTS: 12
      BOOKING_LIMITS_SLOTS: 10
    volumes:
      - h2-data:/booking/data

volumes:
  h2-data: